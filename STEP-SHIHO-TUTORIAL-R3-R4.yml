name: DPRO SHIHO Tutorial R3-R4 Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-R4.yml'

permissions:
  contents: write

jobs:
  tutorial-r3-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authorization lineage
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='59e4ab1411996f7a617c20e6caab784877817652'
          git merge-base --is-ancestor "$BASELINE" HEAD
          echo "WORKFLOW_ENTRY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WORKFLOW_ENTRY_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Build R3 tutorial layer
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > tutorial.js
          echo '' | base64 -d > tutorial.css
          python - <<'PY2'
          from pathlib import Path
          p=Path('config.js'); s=p.read_text()
          marker='DPRO SHIHO Tutorial STANDARD V1.1 / R3 loader'
          if marker not in s:
              import base64
              insert=base64.b64decode('').decode()
              idx=s.rfind('})();')
              if idx < 0: raise SystemExit('config.js final IIFE close not found')
              s=s[:idx]+insert+s[idx:]
              p.write_text(s)
          p=Path('demo-guide.html'); s=p.read_text()
          if 'data-dpro-shiho-tutorial-css' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="./tutorial.css?v=SHIHO-TUTORIAL-R3-20260827" data-dpro-shiho-tutorial-css>\n</head>',1)
          if 'data-dpro-shiho-tutorial-js' not in s:
              s=s.replace('</body>','  <script src="./tutorial.js?v=SHIHO-TUTORIAL-R3-20260827" data-dpro-shiho-tutorial-js></script>\n</body>',1)
          p.write_text(s)
          PY2

      - name: R3 static contract QA
        shell: bash
        run: |
          set -euo pipefail
          node --check tutorial.js
          python - <<'PY2'
          from pathlib import Path
          import re,subprocess
          js=Path('tutorial.js').read_text(); css=Path('tutorial.css').read_text(); cfg=Path('config.js').read_text(); dg=Path('demo-guide.html').read_text()
          assert len(re.findall(r'\{id:(?:[1-9]|10),file:',js)) == 10
          assert 'dpro_tutorial_shiho_v1_1_state' in js
          assert 'pointerdown' in js and 'setPointerCapture' in js
          assert 'INTERACTIVE_SELECTOR' in js and 'PROTECTED_OVERLAYS' in js
          assert 'fetch(' not in js and 'XMLHttpRequest' not in js
          assert 'sessionStorage' in js and 'localStorage' not in js
          assert 'dpro-shiho-tutorial' in cfg and 'tutorial.js' in dg and 'tutorial.css' in dg
          assert 'max-width:calc(100vw - 16px)' in css
          forbidden=['worker.js','wrangler.toml','supabase','schema.sql','.env']
          changed=[x.strip() for x in subprocess.check_output(['git','diff','--name-only']).decode().splitlines()]
          assert set(changed) <= {'tutorial.js','tutorial.css','config.js','demo-guide.html'}, changed
          assert not any(any(f in x.lower() for f in forbidden) for x in changed)
          print({'first10':10,'changed':changed,'mutationCode':0})
          PY2

      - name: Commit R3 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tutorial.js tutorial.css config.js demo-guide.html
          git commit -m "Implement SHIHO Tutorial R3 First10"
          git pull --rebase
          git push
          echo "R3_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R3_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for R3 Pages publication
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/tutorial.js'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL "${URL}?r3=${R3_HEAD}&n=${i}" | grep -q 'DPRO_TUTORIAL_SHIHO'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-tutorial-qa
          cd /tmp/shiho-tutorial-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          echo '' | base64 -d > qa-r3.mjs
          echo '' | base64 -d > qa-r4.mjs

      - name: R3 live browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-tutorial-qa
          BASE_URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/' OUT="$GITHUB_WORKSPACE/r3-live.json" node qa-r3.mjs

      - name: Build R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > guide-center.html
          python - <<'PY2'
          from pathlib import Path
          s=Path('guide-center.html').read_text()
          must=['first10-start','first10-resume','first10-replay','id="roles"','id="system"','id="safety"','id="accessibility"','id="trouble"','R5']
          assert all(x in s for x in must), [x for x in must if x not in s]
          assert 'fetch(' not in s and 'XMLHttpRequest' not in s
          PY2
          git add guide-center.html
          git commit -m "Add SHIHO Tutorial R4 Guide Center"
          git pull --rebase
          git push
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R4_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for R4 Pages publication
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL "${URL}?r4=${R4_HEAD}&n=${i}" | grep -q 'GUIDE CENTER'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: R4 live browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-tutorial-qa
          BASE_URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/' OUT="$GITHUB_WORKSPACE/r4-live.json" node qa-r4.mjs

      - name: R3 regression after R4
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-tutorial-qa
          BASE_URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/' OUT="$GITHUB_WORKSPACE/r3-regression-after-r4.json" node qa-r3.mjs

      - name: Publish evidence and close workflow gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r3 tutorial-evidence/shiho-r4
          cp r3-live.json tutorial-evidence/shiho-r3/r3-live.json
          cp r3-regression-after-r4.json tutorial-evidence/shiho-r4/r3-regression-after-r4.json
          cp r4-live.json tutorial-evidence/shiho-r4/r4-live.json
          python - <<'PY2'
          from pathlib import Path
          import hashlib,json,os,datetime
          files=['tutorial.js','tutorial.css','guide-center.html','config.js','demo-guide.html']
          hashes={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files}
          out={
            'ok':True,
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'baselineHead':'59e4ab1411996f7a617c20e6caab784877817652',
            'workflowEntryHead':os.getenv('WORKFLOW_ENTRY_HEAD'),
            'r3Head':os.getenv('R3_HEAD'),'r3Tree':os.getenv('R3_TREE'),
            'r4Head':os.getenv('R4_HEAD'),'r4Tree':os.getenv('R4_TREE'),
            'first10Count':10,'r3Pass':True,'r4Pass':True,'businessMutation':0,
            'protectedBackendChanged':False,'r5Started':False,'fileSha256':hashes
          }
          Path('tutorial-evidence/shiho-r4/final.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY2
          git add tutorial-evidence
          git rm -f .github/workflows/STEP-SHIHO-TUTORIAL-R3-R4.yml
          git commit -m "Publish SHIHO Tutorial R4 evidence and close gate"
          git pull --rebase
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
