name: DPRO SHIHO Product Ready R3 Evidence Final Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-PRODUCT-READY-R3-EVIDENCE-FINAL.yml'

permissions:
  contents: write

jobs:
  r3-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 source lock
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 232752c032a7c88d13084db20080677f679c4f20 HEAD
          grep -F 'SHIHO-FRONT-PR-R2-20260824' config.js
          grep -F 'dpro-shiho-product-ready-v2' config.js
          grep -F 'dpro-shiho-member-r2' config.js
          grep -F 'LIFF_ID_TOKEN_SERVER_VERIFY' config.js
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fresh health and system-check proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/shiho-r3
          GW='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-shiho-product-ready-v2'

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/health.json -w '%{http_code}' "${GW}/api/health?r3=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('systemCode') == 'SHIHO'
          assert d.get('versions',{}).get('versionsAligned') is True
          assert d.get('security',{}).get('lineIdTokenServerVerify') is True
          assert d.get('security',{}).get('individualStaffSession') is True
          assert d.get('security',{}).get('staffImmediateDisableRevisionCheck') is True
          PY

          code="$(curl -sS -o /tmp/owner.json -w '%{http_code}' \
            -H 'content-type: application/json' -d '{"code":"1234"}' "${GW}/api/owner/session")"
          test "$code" = "200"
          TOKEN="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/owner.json'))
          assert d.get('ok') is True and d.get('session_token')
          print(d['session_token'])
          PY
          )"

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/system.json -w '%{http_code}' \
            -H "x-owner-session: ${TOKEN}" "${GW}/api/system-check?r3=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/system.json'))
          assert d.get('ok') is True
          assert d.get('systemCheck') is True
          assert d.get('versions',{}).get('versionsAligned') is True
          PY

          # Staff authority is already CENTRAL PASS; prove the live owner staff-list authority without changing staff.
          code="$(curl -sS -o /tmp/staff-list.json -w '%{http_code}' -H "x-owner-session: ${TOKEN}" "${GW}/api/staff")"
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/staff-list.json'))
          assert d.get('ok') is True and isinstance(d.get('staff'),list) and len(d['staff'])>=1
          PY

          curl -sS -X POST -H "x-owner-session: ${TOKEN}" "${GW}/api/owner/session/revoke" > /tmp/owner-revoke.json
          cp /tmp/health.json product-ready-evidence/shiho-r3/health.json
          cp /tmp/system.json product-ready-evidence/shiho-r3/system-check.json
          cp /tmp/staff-list.json product-ready-evidence/shiho-r3/staff-list.json
          cp /tmp/owner-revoke.json product-ready-evidence/shiho-r3/owner-revoke.json

      - name: Fresh public URL set
        shell: bash
        run: |
          set -euo pipefail
          APP='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff'
          for path in 'owner.html?demo=1' 'index.html?demo=1' 'member.html?demo=1' 'owner-ipad.html?demo=1' 'staff.html?demo=1' 'system-check.html?demo=1'; do
            code="$(curl -L -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "${APP}/${path}&r3=${GITHUB_RUN_ID}")"
            test "$code" = "200"
          done
          curl -L -sS -o /dev/null -w '%{http_code}\n' 'https://dpro-shop.com/systems/shiho' \
            > product-ready-evidence/shiho-r3/official-site-http.txt || echo 000 > product-ready-evidence/shiho-r3/official-site-http.txt

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-r3
          cd /tmp/shiho-r3
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/shiho-r3/screenshots
          cat > /tmp/shiho-r3/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const BASE='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/';
          const cases=[
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'mobile390-index',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'live-demo-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'system-check',file:'system-check.html?demo=1',width:1440,height:1000},
            {key:'staff-r2-ui',file:'staff.html?demo=1',width:1024,height:768,staffUi:true}
          ];
          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;
          const browser=await chromium.launch({headless:true});
          const results=[]; let failed=false;
          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage(), pageErrors=[], consoleErrors=[], httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});
            let status=0,navigationError='',staffUi=null;
            try{
              const r=await page.goto(BASE+c.file+(c.file.includes('?')?'&':'?')+'r3='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              status=r?.status()||0; await page.waitForTimeout(3500);
              if(c.staffUi) staffUi=await page.evaluate(()=>!!document.querySelector('.pr2-fab') && (document.body?.innerText||'').includes('R2 Staff認証'));
            }catch(e){navigationError=String(e)}
            const metrics=navigationError?null:await page.evaluate(()=>({innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),text:(document.body?.innerText||'').slice(0,250000)}));
            const overflow=metrics?metrics.scrollWidth>metrics.innerWidth+1:true;
            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics?technical.test(metrics.text):true;
            const rec={...c,httpStatus:status,navigationError,overflow,innerWidth:metrics?.innerWidth??0,scrollWidth:metrics?.scrollWidth??0,pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,technicalExposure,staffUi};
            rec.ok=!navigationError&&status===200&&!overflow&&pageErrors.length===0&&blockingConsoleErrors.length===0&&criticalResourceErrors.length===0&&!technicalExposure&&(!c.staffUi||staffUi===true);
            if(!rec.ok)failed=true; results.push(rec);
            if(!navigationError)await page.screenshot({path:`product-ready-evidence/shiho-r3/screenshots/${c.key}.png`,fullPage:true});
            await ctx.close();
          }
          await browser.close();
          const out={ok:!failed,checkedAt:new Date().toISOString(),sourceHead:process.env.SOURCE_HEAD||null,total:results.length,passed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length,results};
          fs.writeFileSync('product-ready-evidence/shiho-r3/browser-final.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({ok:out.ok,total:out.total,passed:out.passed,failed:out.failed},null,2));
          process.exit(out.ok?0:2);
          EOF
          node /tmp/shiho-r3/qa.mjs

      - name: Build final evidence
        shell: python
        run: |
          import json,datetime,os,pathlib
          p=pathlib.Path('product-ready-evidence/shiho-r3')
          b=json.loads((p/'browser-final.json').read_text())
          out={'ok':b.get('ok') is True,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'sourceHead':os.getenv('SOURCE_HEAD'),'closesReadyItems':['READY-006','READY-018','READY-019','READY-020','READY-021','READY-023','READY-028'],
               'ready039AlreadyCentralPass':True,'ready041AlreadyCentralPass':True,'nonblockingReady030':'recorded_only','finalLockSelfConfirmed':False}
          (p/'final.json').write_text(json.dumps(out,indent=2)+'\n')
          assert out['ok']

      - name: Commit evidence and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/shiho-r3
          git commit -m "Publish SHIHO R3 Product READY evidence"
          git pull --rebase
          git push
          git pull --rebase
          git rm -f .github/workflows/STEP-SHIHO-PRODUCT-READY-R3-EVIDENCE-FINAL.yml
          git commit -m "Complete SHIHO Product READY R3 final gate"
          git push
