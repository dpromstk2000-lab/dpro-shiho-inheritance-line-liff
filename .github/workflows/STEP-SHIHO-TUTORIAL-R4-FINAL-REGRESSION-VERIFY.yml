name: DPRO SHIHO R4 Final Regression Verify

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R4-FINAL-REGRESSION-VERIFY.yml'

permissions:
  contents: read

concurrency:
  group: shiho-r4-final-regression-verify
  cancel-in-progress: false

jobs:
  final-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify unchanged R4 source
        shell: bash
        run: |
          set -euo pipefail
          R4_LOCK='65bd0afff4456f7d5872d9c200e1c2fce8a6289d'
          R4_TREE='46fd860f7210c4108fce80583fe75ca8a667d843'
          R3_PASS='67e5f68a3a8e54989b0d2d71828e3151aff457c8'
          git merge-base --is-ancestor "$R4_LOCK" HEAD
          test "$(git rev-parse "$R4_LOCK^{tree}")" = "$R4_TREE"
          unexpected="$(git diff --name-only "$R4_LOCK"..HEAD | grep -Fxv '.github/workflows/STEP-SHIHO-TUTORIAL-R4-FINAL-REGRESSION-VERIFY.yml' || true)"
          test -z "$unexpected"
          test "$(git diff --name-only "$R3_PASS".."$R4_LOCK")" = "guide-center.html"
          grep -q 'STANDARD V1.1 / R4' guide-center.html
          grep -q 'R3-RECOVERY3-POINTER-PASSTHROUGH' tutorial.css
          grep -q 'R3-RECOVERY2-WHOLE-DOCUMENT-MUTATION-OBSERVER-REMOVED' tutorial.js
          ! grep -q 'new MutationObserver' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-RECOVERY3-20260827' config.js
          printf 'SOURCE_DRIFT=0\nR4_LOCK=%s\nR4_TREE=%s\nR3_PASS=%s\nENTRY_HEAD=%s\n' "$R4_LOCK" "$R4_TREE" "$R3_PASS" "$(git rev-parse HEAD)" > source-lock-final-verify.txt

      - name: Verify R4 Guide Center live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 8); do
            if curl --max-time 7 -fsSL "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?finalverify=$GITHUB_RUN_ID&n=$i" -o /tmp/guide.html; then
              if grep -q 'STANDARD V1.1 / R4' /tmp/guide.html; then ok=1; break; fi
            fi
            sleep 3
          done
          test "$ok" = 1
          echo 'R4_GUIDE_CENTER_LIVE=PASS' > r4-live-final-verify.txt

      - name: Install browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-final && cd /tmp/shiho-final
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > final-verify.mjs
          node --check final-verify.mjs

      - name: Run 3 fresh R3 regression attempts
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cd /tmp/shiho-final
          timeout --signal=TERM --kill-after=10s 5m env OUT="$GITHUB_WORKSPACE/r4-final-regression-verify.json" node final-verify.mjs

      - name: Build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f r4-final-regression-verify.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('r4-final-regression-verify.json'))
          vals={
            'DECISION':d.get('decision'),
            'PASS_COUNT':d.get('passCount'),
            'FAIL_COUNT':d.get('failCount'),
            'SAME_MEMBER_FAILURE_COUNT':d.get('sameMemberFailureCount'),
            'BUSINESS_MUTATION_COUNT':d.get('businessMutationCount'),
            'SOURCE_DRIFT':0,
            'PRODUCT_SOURCE_CHANGE':0,
            'R5_R6_R7':'STOP',
          }
          Path('final-verify-summary.txt').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n')
          print(vals)
          for a in d.get('attempts',[]):
            print('attempt',a.get('attempt'),'ok',a.get('ok'),'failure',a.get('failure'))
            print('memberStatuses',a.get('checks',{}).get('memberStatuses'))
          PY

      - name: Upload final verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHIHO-R4-FINAL-REGRESSION-VERIFY
          path: |
            r4-final-regression-verify.json
            source-lock-final-verify.txt
            r4-live-final-verify.txt
            final-verify-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Final gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r4-final-regression-verify.json'))
          assert d.get('decision')=='PASS',d.get('decision')
          assert int(d.get('passCount') or 0)>=2
          assert int(d.get('businessMutationCount') or 0)==0
          print('R4 FINAL QA PASS')
          print('R4 CENTRAL RETURN AUTHORIZED')
          print('R5/R6/R7 STOP')
          PY
