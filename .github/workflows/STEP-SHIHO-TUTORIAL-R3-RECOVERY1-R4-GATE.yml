name: DPRO SHIHO Tutorial R3 Recovery1 R4 Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-RECOVERY1-R4-GATE.yml'

permissions:
  contents: write

concurrency:
  group: shiho-r3-recovery1-r4
  cancel-in-progress: false

jobs:
  recovery1-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify recovery authorization and source lock
        shell: bash
        run: |
          set -euo pipefail
          HOLD_HEAD='8a870e7ed29015afa20cf6726169cb079e524ee5'
          git merge-base --is-ancestor "$HOLD_HEAD" HEAD
          node --check tutorial.js
          grep -q 'R3-FIX1-CROSS-PAGE-RESUME' tutorial.js
          grep -q 'new MutationObserver' tutorial.js
          grep -q 'statusEl.textContent = s.wait ?' tutorial.js
          test ! -f guide-center.html
          echo "ENTRY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply one root-cause repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('tutorial.js')
          s=p.read_text()
          old='''      statusEl.textContent = s.wait ? "画面の準備またはログインを待っています。本人操作後に自動で続きます。" : "対象表示を待っています。";'''
          new='''      // R3-RECOVERY1-MUTATION-OBSERVER-SELF-LOOP-GUARD
                const waitingStatus = s.wait ? "画面の準備またはログインを待っています。本人操作後に自動で続きます。" : "対象表示を待っています。";
                if (statusEl.textContent !== waitingStatus) statusEl.textContent = waitingStatus;'''
          if old not in s:
              raise SystemExit('Expected root-cause line not found; refusing guess repair')
          if s.count(old) != 1:
              raise SystemExit('Root-cause line not unique; refusing repair')
          s=s.replace(old,new,1)
          p.write_text(s)

          for name in ['config.js','demo-guide.html']:
              q=Path(name); t=q.read_text()
              oldv='SHIHO-TUTORIAL-R3-FIX1-20260827'
              newv='SHIHO-TUTORIAL-R3-RECOVERY1-20260827'
              if oldv not in t:
                  raise SystemExit(f'Asset version not found in {name}')
              t=t.replace(oldv,newv)
              q.write_text(t)
          PY

          node --check tutorial.js
          grep -q 'R3-RECOVERY1-MUTATION-OBSERVER-SELF-LOOP-GUARD' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-RECOVERY1-20260827' config.js
          grep -q 'SHIHO-TUTORIAL-R3-RECOVERY1-20260827' demo-guide.html

          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tutorial.js config.js demo-guide.html
          git commit -m "Fix SHIHO Tutorial Step4 MutationObserver self-loop"
          git pull --rebase
          git push
          echo "R3_REPAIR_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for repaired Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl --max-time 8 -fsSL               "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/tutorial.js?repair=${R3_REPAIR_HEAD}&n=$i"               -o /tmp/tutorial-live.js; then
              if grep -q 'R3-RECOVERY1-MUTATION-OBSERVER-SELF-LOOP-GUARD' /tmp/tutorial-live.js; then
                ok=1; break
              fi
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-recovery1 && cd /tmp/shiho-recovery1
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > focused.mjs
          echo '' | base64 -d > full-r3.mjs
          echo '' | base64 -d > r4.mjs
          echo '' | base64 -d > reg.mjs
          node --check focused.mjs
          node --check full-r3.mjs
          node --check r4.mjs
          node --check reg.mjs

      - name: Focused Step4 recovery proof
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-recovery1
          timeout --signal=TERM --kill-after=10s 75s             env OUT="$GITHUB_WORKSPACE/r3-recovery-step4.json" node focused.mjs

      - name: Full R3 recovery LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-recovery1
          timeout --signal=TERM --kill-after=10s 3m             env OUT="$GITHUB_WORKSPACE/r3-recovery-live.json" node full-r3.mjs

      - name: Build R4 Guide Center only after R3 PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          for f in ['r3-recovery-step4.json','r3-recovery-live.json']:
              d=json.load(open(f))
              assert d.get('ok') is True, (f,d)
          assert json.load(open('r3-recovery-live.json')).get('businessMutationCount') == 0
          PY

          echo '' | base64 -d > guide-center.html
          grep -q 'STANDARD V1.1 / R4' guide-center.html
          grep -q 'id="first10-start"' guide-center.html
          grep -q 'id="roles"' guide-center.html
          grep -q 'R5予定' guide-center.html

          git add guide-center.html
          git commit -m "Implement SHIHO Tutorial R4 Guide Center after R3 recovery"
          git pull --rebase
          git push
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for R4 Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl --max-time 8 -fsSL               "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?r4=${R4_HEAD}&n=$i"               -o /tmp/guide-live.html; then
              if grep -q 'STANDARD V1.1 / R4' /tmp/guide-live.html; then ok=1; break; fi
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: R4 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-recovery1
          timeout --signal=TERM --kill-after=10s 90s             env OUT="$GITHUB_WORKSPACE/r4-live.json" node r4.mjs

      - name: R3 regression after R4
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-recovery1
          timeout --signal=TERM --kill-after=10s 90s             env OUT="$GITHUB_WORKSPACE/r3-regression-after-r4.json" node reg.mjs

      - name: Publish final R3-R4 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r4
          cp r3-recovery-step4.json tutorial-evidence/shiho-r4/
          cp r3-recovery-live.json tutorial-evidence/shiho-r4/
          cp r4-live.json tutorial-evidence/shiho-r4/
          cp r3-regression-after-r4.json tutorial-evidence/shiho-r4/
          python - <<'PY'
          import json,os
          from pathlib import Path
          final={
            "ok":True,
            "systemCode":"SHIHO",
            "standard":"DPRO TUTORIAL STANDARD V1.1",
            "rootCause":"MutationObserver self-trigger loop while waiting for Step4 target",
            "repair":"Conditional status text DOM write in waiting branch",
            "r3":"PASS / recovery LIVE QA",
            "r4":"PASS / Guide Center LIVE QA",
            "r3RegressionAfterR4":"PASS",
            "businessMutationCount":0,
            "entryHead":os.environ.get("ENTRY_HEAD"),
            "r3RepairHead":os.environ.get("R3_REPAIR_HEAD"),
            "r4Head":os.environ.get("R4_HEAD"),
            "workflowRunId":os.environ.get("GITHUB_RUN_ID"),
            "r5":"NOT AUTHORIZED / STOP"
          }
          Path('tutorial-evidence/shiho-r4/final.json').write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n')
          Path('tutorial-evidence/shiho-r4/STATUS.txt').write_text(
            'DPRO SHIHO TUTORIAL R3-R4\n'
            'R3 RECOVERY LIVE QA: PASS\n'
            'R4 GUIDE CENTER LIVE QA: PASS\n'
            'R3 REGRESSION AFTER R4: PASS\n'
            'BUSINESS MUTATION: 0\n'
            'R5: STOP\n'
          )
          PY
          git add tutorial-evidence/shiho-r4
          git commit -m "Record SHIHO Tutorial R3 recovery and R4 evidence"
          git pull --rebase
          git push
          echo "EVIDENCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Close temporary SHIHO recovery workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          rm -f             .github/workflows/STEP-SHIHO-TUTORIAL-R3-R4.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-R4-RETRY.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-DIAG-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-FIX1-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-FIX1-RESUME-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-FIX2-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-FIX3-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-FIX4-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-RECOVERY-DIAG.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-RECOVERY1-R4-GATE.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "Close SHIHO Tutorial R3-R4 recovery gates"
            git push
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final summary
        run: |
          echo "ROOT CAUSE = MutationObserver self-trigger loop"
          echo "R3 RECOVERY = PASS"
          echo "R4 GUIDE CENTER = PASS"
          echo "R3 REGRESSION = PASS"
          echo "BUSINESS MUTATION = 0"
          echo "R5 = STOP"
          echo "FINAL HEAD = $FINAL_HEAD"
