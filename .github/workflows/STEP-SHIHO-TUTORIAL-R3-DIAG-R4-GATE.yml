name: DPRO SHIHO Tutorial R3 Diagnostic R4 Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-DIAG-R4-GATE.yml'

permissions:
  contents: write

concurrency:
  group: shiho-tutorial-r3-diagnostic-r4
  cancel-in-progress: false

jobs:
  diag-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R3 baseline
        shell: bash
        run: |
          set -euo pipefail
          R3='5419610010f7fbaed276b20b12df9d893887d05f'
          git merge-base --is-ancestor "$R3" HEAD
          test -f tutorial.js
          test -f tutorial.css
          grep -q 'DPRO_TUTORIAL_SHIHO' tutorial.js
          node --check tutorial.js

      - name: Install Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-diag
          cd /tmp/shiho-diag
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > diag.mjs
          node --check diag.mjs

      - name: R3 diagnostic live QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-diag
          # Hard stop: never wait 35 minutes again.
          timeout --signal=TERM --kill-after=15s 7m env OUT="$GITHUB_WORKSPACE/r3-diag.json" node diag.mjs

      - name: Build R4 only after R3 diagnostic PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r3-diag.json'))
          assert d.get('ok') is True, d
          print('R3_DIAG_GATE=PASS')
          PY
          echo '' | base64 -d > guide-center.html
          grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1' guide-center.html
          grep -q 'id="first10-start"' guide-center.html
          grep -q 'id="roles"' guide-center.html
          grep -q 'id="system"' guide-center.html
          grep -q 'id="safety"' guide-center.html
          grep -q 'id="accessibility"' guide-center.html
          grep -q 'R5予定' guide-center.html

          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add guide-center.html
          if ! git diff --cached --quiet; then
            git commit -m "Implement SHIHO Tutorial R4 Guide Center"
            git pull --rebase
            git push
          fi
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for R4 Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 48); do
            if curl --max-time 10 -fsSL "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?run=${GITHUB_RUN_ID}&n=$i" | grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: R4 lightweight live QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-diag
          cat > r4.mjs <<'JS'
          import { chromium } from 'playwright';
          const B='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html';
          const browser=await chromium.launch({headless:true});
          try {
            for (const s of [{w:1440,h:1000},{w:390,h:844},{w:320,h:720}]) {
              const c=await browser.newContext({viewport:{width:s.w,height:s.h}});
              c.setDefaultTimeout(12000);
              const p=await c.newPage();
              const r=await p.goto(B+'?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
              const m=await p.evaluate(()=>({
                w:innerWidth,sw:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
                first:!!document.querySelector('#first10-start'),
                roles:document.querySelectorAll('#roles .card').length,
                system:!!document.querySelector('#system'),
                safety:!!document.querySelector('#safety'),
                access:!!document.querySelector('#accessibility'),
                manuals:document.querySelectorAll('#manuals .card').length
              }));
              if(r?.status()!==200||m.sw>m.w+1||!m.first||m.roles<4||!m.system||!m.safety||!m.access||m.manuals<2) throw new Error(JSON.stringify({s,m,status:r?.status()}));
              console.log('R4_VIEW_PASS',s.w,m);
              await c.close();
            }
          } finally { await browser.close(); }
          JS
          timeout --signal=TERM --kill-after=10s 3m node r4.mjs

      - name: Publish R3-R4 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r4
          cp r3-diag.json tutorial-evidence/shiho-r4/r3-live-diagnostic.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          final={
            "ok":True,
            "systemCode":"SHIHO",
            "standard":"DPRO TUTORIAL STANDARD V1.1",
            "r3":"LIVE QA PASS (diagnostic hardened)",
            "r4":"GUIDE CENTER LIVE QA PASS",
            "businessMutationCount":0,
            "r4Head":os.environ.get("R4_HEAD"),
            "workflowRunId":os.environ.get("GITHUB_RUN_ID"),
            "r5":"NOT AUTHORIZED / STOP"
          }
          Path('tutorial-evidence/shiho-r4/final.json').write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n')
          Path('tutorial-evidence/shiho-r4/STATUS.txt').write_text(
            'DPRO SHIHO TUTORIAL R3-R4\nR3 LIVE QA: PASS\nR4 GUIDE CENTER: PASS\nBUSINESS MUTATION: 0\nR5: STOP\n'
          )
          PY
          git add tutorial-evidence/shiho-r4
          git commit -m "Record SHIHO Tutorial R3-R4 final evidence"
          git pull --rebase
          git push

      - name: Final summary
        run: |
          echo "R3 LIVE QA = PASS"
          echo "R4 GUIDE CENTER = PASS"
          echo "R5 = STOP"
