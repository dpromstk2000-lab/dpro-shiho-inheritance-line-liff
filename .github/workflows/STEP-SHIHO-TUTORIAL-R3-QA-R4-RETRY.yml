name: DPRO SHIHO Tutorial R3 QA Retry R4 Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-R4-RETRY.yml'

permissions:
  contents: write

concurrency:
  group: shiho-tutorial-r3qa-r4-retry
  cancel-in-progress: false

jobs:
  r3qa-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing R3 implementation
        shell: bash
        run: |
          set -euo pipefail
          R3_HEAD='5419610010f7fbaed276b20b12df9d893887d05f'
          git merge-base --is-ancestor "$R3_HEAD" HEAD
          test -f tutorial.js
          test -f tutorial.css
          grep -q 'DPRO_TUTORIAL_SHIHO' tutorial.js
          grep -q 'dpro_tutorial_shiho_v1_1_state' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-20260827' config.js
          node --check tutorial.js
          echo "ENTRY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R3_BASE_HEAD=$R3_HEAD" >> "$GITHUB_ENV"

      - name: Wait for current R3 Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/tutorial.js'
          ok=0
          for i in $(seq 1 36); do
            if curl -fsSL "${URL}?retry=${GITHUB_RUN_ID}-${i}" | grep -q 'DPRO_TUTORIAL_SHIHO'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-tutorial-retry
          cd /tmp/shiho-tutorial-retry
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          echo '' | base64 -d > qa-r3-retry.mjs
          echo '' | base64 -d > qa-r4.mjs
          echo '' | base64 -d > qa-r3-regression.mjs
          node --check qa-r3-retry.mjs
          node --check qa-r4.mjs
          node --check qa-r3-regression.mjs

      - name: R3 live browser QA retry
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-tutorial-retry
          BASE_URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/'           OUT="$GITHUB_WORKSPACE/r3-live-retry.json"           node qa-r3-retry.mjs

      - name: Build R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > guide-center.html
          python - <<'PY'
          from pathlib import Path
          s=Path('guide-center.html').read_text()
          required=[
              'id="first10-start"','id="first10-resume"','id="first10-replay"',
              'id="roles"','id="system"','id="safety"','id="trouble"',
              'id="accessibility"','id="manuals"','R5'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          assert 'fetch(' not in s and 'XMLHttpRequest' not in s
          assert 'POST' not in s and 'PATCH' not in s and 'DELETE' not in s
          print({"r4Static":"PASS","missing":[],"businessMutationCode":0})
          PY

          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add guide-center.html
          if git diff --cached --quiet; then
            echo "R4 guide already current"
          else
            git commit -m "Implement SHIHO Tutorial R4 Guide Center"
            git pull --rebase
            git push
          fi
          echo "R4_IMPLEMENTATION_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R4_IMPLEMENTATION_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for R4 Pages publication
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html'
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL "${URL}?r4=${R4_IMPLEMENTATION_HEAD}&n=${i}" | grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: R4 live browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-tutorial-retry
          BASE_URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/'           OUT="$GITHUB_WORKSPACE/r4-live.json"           node qa-r4.mjs

      - name: R3 regression after R4
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-tutorial-retry
          BASE_URL='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/'           OUT="$GITHUB_WORKSPACE/r3-regression-after-r4.json"           node qa-r3-regression.mjs

      - name: Publish evidence and close R4 gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r4
          cp r3-live-retry.json tutorial-evidence/shiho-r4/
          cp r4-live.json tutorial-evidence/shiho-r4/
          cp r3-regression-after-r4.json tutorial-evidence/shiho-r4/

          python - <<'PY'
          import json,os
          from pathlib import Path
          status={
            "ok": True,
            "systemCode":"SHIHO",
            "standard":"DPRO TUTORIAL STANDARD V1.1",
            "r3":"LIVE QA PASS (retry)",
            "r4":"GUIDE CENTER + LIVE QA PASS",
            "r3RegressionAfterR4":"PASS",
            "businessMutationCount":0,
            "r3BaselineHead":os.environ["R3_BASE_HEAD"],
            "r4ImplementationHead":os.environ["R4_IMPLEMENTATION_HEAD"],
            "r4ImplementationTree":os.environ["R4_IMPLEMENTATION_TREE"],
            "workflowRunId":os.environ.get("GITHUB_RUN_ID"),
          }
          Path("tutorial-evidence/shiho-r4/final.json").write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\n")
          Path("tutorial-evidence/shiho-r4/STATUS.txt").write_text(
            "DPRO SHIHO TUTORIAL R3-R4\n"
            "R3 LIVE QA RETRY: PASS\n"
            "R4 GUIDE CENTER: PASS\n"
            "R3 REGRESSION AFTER R4: PASS\n"
            "BUSINESS MUTATION: 0\n"
            "STOP: R5 NOT AUTHORIZED\n"
          )
          PY

          git add tutorial-evidence/shiho-r4
          git commit -m "Record SHIHO Tutorial R3-R4 QA evidence"
          git pull --rebase
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final summary
        shell: bash
        run: |
          echo "R3 QA RETRY = PASS"
          echo "R4 GUIDE CENTER = PASS"
          echo "R3 REGRESSION AFTER R4 = PASS"
          echo "BUSINESS MUTATION = 0"
          echo "R5 = STOP"
          echo "FINAL HEAD = $(git rev-parse HEAD)"
