name: DPRO SHIHO Tutorial R3 Recovery Diagnosis

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-RECOVERY-DIAG.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify recovery source lock
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='8a870e7ed29015afa20cf6726169cb079e524ee5'
          CURRENT="$(git rev-parse HEAD)"
          echo "CURRENT_HEAD=$CURRENT"
          # Forward adoption is allowed, but the accepted source lock must remain an ancestor.
          git merge-base --is-ancestor "$EXPECTED" "$CURRENT"
          node --check tutorial.js
          grep -q 'R3-FIX1-CROSS-PAGE-RESUME' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-FIX1-20260827' config.js
          test ! -f guide-center.html

      - name: Install diagnostic browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-r3-recovery-diag
          cd /tmp/shiho-r3-recovery-diag
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > diag.mjs
          node --check diag.mjs

      - name: Capture Step4 bootstrap timeline
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-r3-recovery-diag
          timeout --signal=TERM --kill-after=10s 75s             env OUT="$GITHUB_WORKSPACE/SHIHO_R3_RECOVERY_DIAG.json" node diag.mjs

      - name: Print compact diagnostic evidence
        if: always()
        shell: bash
        run: |
          if [ -f SHIHO_R3_RECOVERY_DIAG.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('SHIHO_R3_RECOVERY_DIAG.json'))
          print(json.dumps({
            'ok':d.get('ok'),
            'mode':d.get('mode'),
            'finalUrl':d.get('finalUrl'),
            'finalEval':d.get('finalEval'),
            'network':d.get('network'),
            'pageErrors':d.get('pageErrors'),
            'businessMutations':d.get('businessMutations'),
            'eventsTail':(d.get('events') or [])[-80:]
          },ensure_ascii=False,indent=2))
          PY
          else
            echo "DIAGNOSTIC_JSON_MISSING"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHIHO-R3-RECOVERY-DIAG
          path: SHIHO_R3_RECOVERY_DIAG.json
          if-no-files-found: warn
          retention-days: 7
