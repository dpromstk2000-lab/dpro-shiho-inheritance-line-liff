name: DPRO SHIHO Tutorial R3 FIX1 R4 Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-FIX1-R4-GATE.yml'
permissions:
  contents: write
concurrency:
  group: shiho-r3-fix1-r4
  cancel-in-progress: false

jobs:
  fix1-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cross-page Resume
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tutorial.js')
          s=p.read_text()
          replacements={
            'location.assign(routeUrl(step.file));':'location.assign(routeUrl(step.file, "resume"));',
            'location.assign(routeUrl(nextStep.file));':'location.assign(routeUrl(nextStep.file, "resume"));',
            'location.assign(routeUrl(prev.file))':'location.assign(routeUrl(prev.file, "resume"))',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected R3 source: {old}')
              s=s.replace(old,new)
          if 'R3-FIX1-CROSS-PAGE-RESUME' not in s:
              s=s.replace('"use strict";','"use strict";\n  // R3-FIX1-CROSS-PAGE-RESUME',1)
          p.write_text(s)

          for f in ['config.js','demo-guide.html']:
              q=Path(f); t=q.read_text()
              t=t.replace('SHIHO-TUTORIAL-R3-20260827','SHIHO-TUTORIAL-R3-FIX1-20260827')
              q.write_text(t)
          PY
          node --check tutorial.js
          grep -q 'R3-FIX1-CROSS-PAGE-RESUME' tutorial.js
          grep -q 'routeUrl(nextStep.file, "resume")' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-FIX1-20260827' config.js

          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tutorial.js config.js demo-guide.html
          git commit -m "Fix SHIHO Tutorial R3 cross-page Resume"
          git pull --rebase
          git push
          echo "FIX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for FIX1 Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 48); do
            if curl --max-time 8 -fsSL "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/tutorial.js?fix=${FIX_HEAD}&n=$i" | grep -q 'R3-FIX1-CROSS-PAGE-RESUME'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-fix1 && cd /tmp/shiho-fix1
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > qa.mjs
          node --check qa.mjs

      - name: R3 FIX1 live QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-fix1
          timeout --signal=TERM --kill-after=10s 5m env OUT="$GITHUB_WORKSPACE/r3-fix1-live.json" node qa.mjs

      - name: Build R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r3-fix1-live.json'))
          assert d['ok'] is True
          assert d['businessMutationCount']==0
          PY
          echo '' | base64 -d > guide-center.html
          grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1' guide-center.html
          grep -q 'id="roles"' guide-center.html
          grep -q 'R5予定' guide-center.html
          git add guide-center.html
          git commit -m "Implement SHIHO Tutorial R4 Guide Center"
          git pull --rebase
          git push
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for R4 Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 48); do
            if curl --max-time 8 -fsSL "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?r4=${R4_HEAD}&n=$i" | grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: R4 responsive smoke QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-fix1
          cat > r4.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          try{
            for(const s of [{w:1440,h:1000},{w:390,h:844},{w:320,h:720}]){
              const c=await b.newContext({viewport:{width:s.w,height:s.h}});const p=await c.newPage();
              const r=await p.goto('https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?q='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
              const m=await p.evaluate(()=>({w:innerWidth,sw:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),roles:document.querySelectorAll('#roles .c').length,first:!!document.querySelector('#first10-start'),system:!!document.querySelector('#system'),safe:!!document.querySelector('#safety'),a11y:!!document.querySelector('#accessibility')}));
              if(r?.status()!==200||m.sw>m.w+1||m.roles<4||!m.first||!m.system||!m.safe||!m.a11y)throw new Error(JSON.stringify({s,m,status:r?.status()}));
              console.log('R4_PASS',s.w);await c.close();
            }
          }finally{await b.close()}
          JS
          timeout --signal=TERM --kill-after=10s 2m node r4.mjs

      - name: Publish final evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r4
          cp r3-fix1-live.json tutorial-evidence/shiho-r4/r3-fix1-live.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          final={
            "ok":True,
            "systemCode":"SHIHO",
            "standard":"DPRO TUTORIAL STANDARD V1.1",
            "r3":"PASS / FIX1 cross-page Resume",
            "r4":"PASS / Guide Center",
            "businessMutationCount":0,
            "r3FixHead":os.environ.get("FIX_HEAD"),
            "r4Head":os.environ.get("R4_HEAD"),
            "r5":"NOT AUTHORIZED / STOP"
          }
          Path('tutorial-evidence/shiho-r4/final.json').write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n')
          Path('tutorial-evidence/shiho-r4/STATUS.txt').write_text('R3: PASS\nR4: PASS\nBUSINESS MUTATION: 0\nR5: STOP\n')
          PY
          git add tutorial-evidence/shiho-r4
          git commit -m "Record SHIHO Tutorial R3-R4 final evidence"
          git pull --rebase
          git push

      - name: Final summary
        run: |
          echo "R3 = PASS"
          echo "R4 = PASS"
          echo "R5 = STOP"
