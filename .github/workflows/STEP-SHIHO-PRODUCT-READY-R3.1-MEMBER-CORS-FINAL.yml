name: DPRO SHIHO Product Ready R3.1 Member CORS Final Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-PRODUCT-READY-R3.1-MEMBER-CORS-FINAL.yml'

permissions:
  contents: write

jobs:
  r31-member-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R3 lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor aeda03c6bfcc81e8f300fe2384b45fac2cb3e813 HEAD
          grep -F 'dpro-shiho-member-r2' config.js
          grep -F 'x-request-id' config.js
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify Member Gateway v2 CORS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/shiho-r31-cors
          BASE='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-shiho-member-r2'

          code="$(curl -sS -D /tmp/preflight.headers -o /tmp/preflight.body -w '%{http_code}' \
            -X OPTIONS \
            -H 'Origin: https://dpromstk2000-lab.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-request-id' \
            "${BASE}/api/member/session")"
          echo "preflight_http=${code}"
          test "$code" = "204"
          grep -i '^access-control-allow-origin: https://dpromstk2000-lab.github.io' /tmp/preflight.headers
          grep -i '^access-control-allow-headers:.*X-Request-ID' /tmp/preflight.headers

          code="$(curl -sS -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' \
            -H 'Origin: https://dpromstk2000-lab.github.io' \
            "${BASE}/api/health?r31=${GITHUB_RUN_ID}")"
          echo "health_http=${code}"
          test "$code" = "200"
          grep -i '^x-dpro-version: SHIHO-PR2-MEMBER-CORS-R1-20260824' /tmp/health.headers

          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('version') == 'SHIHO-PR2-MEMBER-CORS-R1-20260824'
          assert d.get('authority') == 'LIFF_ID_TOKEN_SERVER_VERIFY'
          PY

          cp /tmp/preflight.headers product-ready-evidence/shiho-r31-cors/preflight.headers.txt
          cp /tmp/health.headers product-ready-evidence/shiho-r31-cors/health.headers.txt
          cp /tmp/health.json product-ready-evidence/shiho-r31-cors/health.json

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-r31
          cd /tmp/shiho-r31
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh member browser proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/shiho-r31-cors/screenshots

          cat > /tmp/shiho-r31/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/';
          const cases=[
            {key:'member320',width:320,height:720},
            {key:'member390',width:390,height:844}
          ];

          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[],consoleErrors=[],httpErrors=[],memberSessionStatuses=[];

            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{
              if(r.status()>=400) httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()});
              if(r.url().includes('/dpro-shiho-member-r2/api/member/session')) memberSessionStatuses.push(r.status());
            });

            let status=0,navigationError='';
            try{
              const r=await page.goto(BASE+'member.html?demo=1&r31='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              status=r?.status()||0;
              await page.waitForTimeout(5000);
            }catch(e){navigationError=String(e)}

            const metrics=navigationError?null:await page.evaluate(()=>({
              innerWidth,
              scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
              text:(document.body?.innerText||'').slice(0,250000)
            }));

            const overflow=metrics?metrics.scrollWidth>metrics.innerWidth+1:true;
            const corsErrors=consoleErrors.filter(x=>/CORS|x-request-id|Failed to load resource|net::ERR_/i.test(x));
            const technicalExposure=metrics?/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace)/i.test(metrics.text):true;
            const memberSession200=memberSessionStatuses.includes(200);

            const rec={...c,httpStatus:status,navigationError,overflow,
              innerWidth:metrics?.innerWidth??0,scrollWidth:metrics?.scrollWidth??0,
              pageErrors,consoleErrors,corsErrors,httpErrors,memberSessionStatuses,memberSession200,technicalExposure};

            rec.ok=!navigationError&&status===200&&!overflow&&pageErrors.length===0&&consoleErrors.length===0&&corsErrors.length===0&&memberSession200&&!technicalExposure;
            if(!rec.ok)failed=true;
            results.push(rec);

            if(!navigationError) await page.screenshot({path:`product-ready-evidence/shiho-r31-cors/screenshots/${c.key}.png`,fullPage:true});
            await ctx.close();
          }

          await browser.close();

          const out={
            ok:!failed,
            checkedAt:new Date().toISOString(),
            sourceHead:process.env.SOURCE_HEAD||null,
            memberGatewayVersion:'SHIHO-PR2-MEMBER-CORS-R1-20260824',
            memberGatewayDeploymentVersion:2,
            total:results.length,
            passed:results.filter(x=>x.ok).length,
            failed:results.filter(x=>!x.ok).length,
            results
          };

          fs.writeFileSync('product-ready-evidence/shiho-r31-cors/browser-member-final.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({ok:out.ok,total:out.total,passed:out.passed,failed:out.failed},null,2));
          process.exit(out.ok?0:2);
          EOF

          node /tmp/shiho-r31/qa.mjs

      - name: Build correction evidence
        shell: python
        run: |
          import json,datetime,os,pathlib
          p=pathlib.Path('product-ready-evidence/shiho-r31-cors')
          b=json.loads((p/'browser-member-final.json').read_text())
          out={
            'ok':b.get('ok') is True,
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sourceHead':os.getenv('SOURCE_HEAD'),
            'correctsCentralRegression':'member_cors_x_request_id',
            'priorR3Run':32718754223,
            'memberGatewayVersion':2,
            'memberGatewaySha256':'562f2a10d3bd903c3432a813360dd0c3f2cc815e13eda171cb9c4452abca19c7',
            'finalLockSelfConfirmed':False
          }
          (p/'final.json').write_text(json.dumps(out,indent=2)+'\n')
          assert out['ok']

      - name: Commit correction evidence and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/shiho-r31-cors
          git commit -m "Publish SHIHO R3.1 member CORS evidence"
          git pull --rebase
          git push
          git pull --rebase
          git rm -f .github/workflows/STEP-SHIHO-PRODUCT-READY-R3.1-MEMBER-CORS-FINAL.yml
          git commit -m "Complete SHIHO Product READY R3.1 member CORS gate"
          git push
