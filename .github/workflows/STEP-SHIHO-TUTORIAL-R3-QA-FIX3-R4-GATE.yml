name: DPRO SHIHO Tutorial R3 QA FIX3 R4 Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-FIX3-R4-GATE.yml'

permissions:
  contents: write

concurrency:
  group: shiho-r3-qa-fix3-r4
  cancel-in-progress: false

jobs:
  fix2-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify FIX1 product baseline
        shell: bash
        run: |
          set -euo pipefail
          FIX='93c73e454bb51a623826b556cab7fa59efc70653'
          git merge-base --is-ancestor "$FIX" HEAD
          grep -q 'R3-FIX1-CROSS-PAGE-RESUME' tutorial.js
          grep -q 'routeUrl(nextStep.file, "resume")' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-FIX1-20260827' config.js
          node --check tutorial.js
          test ! -f guide-center.html
          echo "ENTRY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify current Pages
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 10 -fsSL             "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/tutorial.js?fix3=${GITHUB_RUN_ID}"             -o /tmp/tutorial-live.js
          grep -q 'R3-FIX1-CROSS-PAGE-RESUME' /tmp/tutorial-live.js
          echo "CURRENT_PAGES=PASS"

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-fix2 && cd /tmp/shiho-fix2
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > r3.mjs
          echo '' | base64 -d > r4.mjs
          echo '' | base64 -d > reg.mjs
          node --check r3.mjs
          node --check r4.mjs
          node --check reg.mjs

      - name: R3 live QA FIX3 with navigation-safe wait
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-fix2
          timeout --signal=TERM --kill-after=10s 3m             env OUT="$GITHUB_WORKSPACE/r3-fix3-live.json" node r3.mjs

      - name: Build R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r3-fix3-live.json'))
          assert d.get('ok') is True, d
          assert d.get('businessMutationCount') == 0, d
          PY

          echo '' | base64 -d > guide-center.html
          grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1' guide-center.html
          grep -q 'id="first10-start"' guide-center.html
          grep -q 'id="first10-resume"' guide-center.html
          grep -q 'id="first10-replay"' guide-center.html
          grep -q 'id="roles"' guide-center.html
          grep -q 'id="system"' guide-center.html
          grep -q 'id="safety"' guide-center.html
          grep -q 'id="trouble"' guide-center.html
          grep -q 'id="accessibility"' guide-center.html
          grep -q 'id="manuals"' guide-center.html
          grep -q 'R5予定' guide-center.html

          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add guide-center.html
          git commit -m "Implement SHIHO Tutorial R4 Guide Center"
          git pull --rebase
          git push
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for R4 Pages safely
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            if curl --max-time 8 -fsSL               "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?fix3=${GITHUB_RUN_ID}&n=$i"               -o /tmp/guide-live.html; then
              if grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1' /tmp/guide-live.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "R4_PAGES=PASS"

      - name: R4 live browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-fix2
          timeout --signal=TERM --kill-after=10s 2m             env OUT="$GITHUB_WORKSPACE/r4-live.json" node r4.mjs

      - name: R3 regression after R4
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-fix2
          timeout --signal=TERM --kill-after=10s 90s             env OUT="$GITHUB_WORKSPACE/r3-regression-after-r4.json" node reg.mjs

      - name: Publish final R3-R4 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r4
          cp r3-fix3-live.json tutorial-evidence/shiho-r4/
          cp r4-live.json tutorial-evidence/shiho-r4/
          cp r3-regression-after-r4.json tutorial-evidence/shiho-r4/

          python - <<'PY'
          import json,os
          from pathlib import Path
          final={
            "ok": True,
            "systemCode": "SHIHO",
            "standard": "DPRO TUTORIAL STANDARD V1.1",
            "r3": "PASS / FIX1 cross-page Resume + demo LIFF-isolated QA",
            "r4": "PASS / Guide Center + LIVE QA",
            "r3RegressionAfterR4": "PASS",
            "businessMutationCount": 0,
            "entryHead": os.environ.get("ENTRY_HEAD"),
            "r4Head": os.environ.get("R4_HEAD"),
            "workflowRunId": os.environ.get("GITHUB_RUN_ID"),
            "r5": "NOT AUTHORIZED / STOP"
          }
          Path('tutorial-evidence/shiho-r4/final.json').write_text(
              json.dumps(final,ensure_ascii=False,indent=2)+'\n'
          )
          Path('tutorial-evidence/shiho-r4/STATUS.txt').write_text(
              'DPRO SHIHO TUTORIAL R3-R4\n'
              'R3 LIVE QA: PASS\n'
              'R4 GUIDE CENTER LIVE QA: PASS\n'
              'R3 REGRESSION AFTER R4: PASS\n'
              'BUSINESS MUTATION: 0\n'
              'R5: STOP\n'
          )
          PY

          git add tutorial-evidence/shiho-r4
          git commit -m "Record SHIHO Tutorial R3-R4 final evidence"
          git pull --rebase
          git push
          echo "EVIDENCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove temporary SHIHO Tutorial workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          rm -f             .github/workflows/STEP-SHIHO-TUTORIAL-R3-R4.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-R4-RETRY.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-DIAG-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-FIX1-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-FIX1-RESUME-R4-GATE.yml             .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-FIX2-R4-GATE.yml \
            .github/workflows/STEP-SHIHO-TUTORIAL-R3-QA-FIX3-R4-GATE.yml
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "No temporary workflow cleanup needed"
          else
            git commit -m "Close SHIHO Tutorial R3-R4 workflow gates"
            git push
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final summary
        run: |
          echo "R3 LIVE QA = PASS"
          echo "R4 GUIDE CENTER = PASS"
          echo "R3 REGRESSION AFTER R4 = PASS"
          echo "BUSINESS MUTATION = 0"
          echo "R5 = STOP"
          echo "FINAL HEAD = $FINAL_HEAD"
