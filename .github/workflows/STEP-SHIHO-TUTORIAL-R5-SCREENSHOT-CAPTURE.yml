name: DPRO SHIHO R5 Screenshot Capture V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R5-SCREENSHOT-CAPTURE.yml'

permissions:
  contents: read

concurrency:
  group: shiho-r5-screenshot-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R4 product lock and no product drift
        shell: bash
        run: |
          set -euo pipefail
          R4_LOCK='65bd0afff4456f7d5872d9c200e1c2fce8a6289d'
          R4_TREE='46fd860f7210c4108fce80583fe75ca8a667d843'
          git merge-base --is-ancestor "$R4_LOCK" HEAD
          test "$(git rev-parse "$R4_LOCK^{tree}")" = "$R4_TREE"
          unexpected="$(git diff --name-only "$R4_LOCK"..HEAD | grep -Ev '^\.github/workflows/(STEP-SHIHO-TUTORIAL-R4-FINAL-REGRESSION-VERIFY|STEP-SHIHO-TUTORIAL-R5-SCREENSHOT-CAPTURE)\.yml$' || true)"
          test -z "$unexpected"
          grep -q 'STANDARD V1.1 / R4' guide-center.html
          grep -q 'R3-RECOVERY3-POINTER-PASSTHROUGH' tutorial.css
          echo "R4_LOCK=$R4_LOCK" > screenshot-source-lock.txt
          echo "R4_TREE=$R4_TREE" >> screenshot-source-lock.txt
          echo "ENTRY_HEAD=$(git rev-parse HEAD)" >> screenshot-source-lock.txt
          echo "PRODUCT_SOURCE_DRIFT=0" >> screenshot-source-lock.txt

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-r5 && cd /tmp/shiho-r5
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > capture.mjs
          node --check capture.mjs

      - name: Capture current Pages screens
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-r5
          timeout --signal=TERM --kill-after=10s 3m env OUT="$GITHUB_WORKSPACE/r5-screens" node capture.mjs
          test -f "$GITHUB_WORKSPACE/r5-screens/SCREENSHOT_CAPTURE_EVIDENCE.json"
          python - <<'PY'
          import json
          import os
          d=json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'r5-screens','SCREENSHOT_CAPTURE_EVIDENCE.json')))
          assert d['ok'] is True
          assert d['businessMutationCount']==0
          print('screens=',len([x for x in d['screenshots'] if 'name' in x]))
          print('businessMutationCount=',d['businessMutationCount'])
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SHIHO-R5-CURRENT-SCREENSHOTS
          path: |
            r5-screens/*.png
            r5-screens/SCREENSHOT_CAPTURE_EVIDENCE.json
            screenshot-source-lock.txt
          if-no-files-found: error
          retention-days: 14
