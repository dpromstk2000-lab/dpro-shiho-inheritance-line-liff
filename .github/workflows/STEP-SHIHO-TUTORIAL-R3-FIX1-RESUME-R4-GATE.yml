name: DPRO SHIHO Tutorial R3 FIX1 Resume R4 Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHIHO-TUTORIAL-R3-FIX1-RESUME-R4-GATE.yml'

permissions:
  contents: write

concurrency:
  group: shiho-r3-fix1-resume-r4
  cancel-in-progress: false

jobs:
  resume-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify FIX1 baseline
        shell: bash
        run: |
          set -euo pipefail
          FIX='93c73e454bb51a623826b556cab7fa59efc70653'
          git merge-base --is-ancestor "$FIX" HEAD
          grep -q 'R3-FIX1-CROSS-PAGE-RESUME' tutorial.js
          grep -q 'routeUrl(nextStep.file, "resume")' tutorial.js
          grep -q 'SHIHO-TUTORIAL-R3-FIX1-20260827' config.js
          node --check tutorial.js
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify FIX1 Pages safely
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            if curl --max-time 8 -fsSL               "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/tutorial.js?resume=${GITHUB_RUN_ID}&n=$i"               -o /tmp/tutorial-live.js; then
              if grep -q 'R3-FIX1-CROSS-PAGE-RESUME' /tmp/tutorial-live.js; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "FIX1_PAGES=PASS"

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiho-resume && cd /tmp/shiho-resume
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          echo '' | base64 -d > r3.mjs
          echo '' | base64 -d > r4.mjs
          echo '' | base64 -d > reg.mjs
          node --check r3.mjs
          node --check r4.mjs
          node --check reg.mjs

      - name: R3 FIX1 live QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-resume
          timeout --signal=TERM --kill-after=10s 5m             env OUT="$GITHUB_WORKSPACE/r3-fix1-live.json" node r3.mjs

      - name: Build R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r3-fix1-live.json'))
          assert d.get('ok') is True, d
          assert d.get('businessMutationCount') == 0, d
          PY

          echo '' | base64 -d > guide-center.html
          grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1' guide-center.html
          grep -q 'id="first10-start"' guide-center.html
          grep -q 'id="first10-resume"' guide-center.html
          grep -q 'id="first10-replay"' guide-center.html
          grep -q 'id="roles"' guide-center.html
          grep -q 'id="system"' guide-center.html
          grep -q 'id="safety"' guide-center.html
          grep -q 'id="trouble"' guide-center.html
          grep -q 'id="accessibility"' guide-center.html
          grep -q 'R5予定' guide-center.html

          git config user.name "dpro-tutorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add guide-center.html
          if git diff --cached --quiet; then
            echo "Guide Center already current"
          else
            git commit -m "Implement SHIHO Tutorial R4 Guide Center"
            git pull --rebase
            git push
          fi
          echo "R4_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify R4 Pages safely
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            if curl --max-time 8 -fsSL               "https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff/guide-center.html?resume=${GITHUB_RUN_ID}&n=$i"               -o /tmp/guide-live.html; then
              if grep -q 'DPRO SHIHO / GUIDE CENTER / STANDARD V1.1' /tmp/guide-live.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "R4_PAGES=PASS"

      - name: R4 live QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-resume
          timeout --signal=TERM --kill-after=10s 2m             env OUT="$GITHUB_WORKSPACE/r4-live.json" node r4.mjs

      - name: R3 regression after R4
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiho-resume
          timeout --signal=TERM --kill-after=10s 2m             env OUT="$GITHUB_WORKSPACE/r3-regression-after-r4.json" node reg.mjs

      - name: Publish final evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/shiho-r4
          cp r3-fix1-live.json tutorial-evidence/shiho-r4/
          cp r4-live.json tutorial-evidence/shiho-r4/
          cp r3-regression-after-r4.json tutorial-evidence/shiho-r4/

          python - <<'PY'
          import json,os
          from pathlib import Path
          final={
            "ok":True,
            "systemCode":"SHIHO",
            "standard":"DPRO TUTORIAL STANDARD V1.1",
            "r3":"PASS / FIX1 cross-page Resume",
            "r4":"PASS / Guide Center + LIVE QA",
            "r3RegressionAfterR4":"PASS",
            "businessMutationCount":0,
            "baseHead":os.environ.get("BASE_HEAD"),
            "r4Head":os.environ.get("R4_HEAD"),
            "workflowRunId":os.environ.get("GITHUB_RUN_ID"),
            "r5":"NOT AUTHORIZED / STOP"
          }
          Path('tutorial-evidence/shiho-r4/final.json').write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n')
          Path('tutorial-evidence/shiho-r4/STATUS.txt').write_text(
            'DPRO SHIHO TUTORIAL R3-R4\n'
            'R3 FIX1 LIVE QA: PASS\n'
            'R4 GUIDE CENTER LIVE QA: PASS\n'
            'R3 REGRESSION AFTER R4: PASS\n'
            'BUSINESS MUTATION: 0\n'
            'R5: STOP\n'
          )
          PY

          git add tutorial-evidence/shiho-r4
          git commit -m "Record SHIHO Tutorial R3-R4 final evidence"
          git pull --rebase
          git push

      - name: Final summary
        run: |
          echo "R3 FIX1 LIVE QA = PASS"
          echo "R4 GUIDE CENTER = PASS"
          echo "R3 REGRESSION AFTER R4 = PASS"
          echo "BUSINESS MUTATION = 0"
          echo "R5 = STOP"
